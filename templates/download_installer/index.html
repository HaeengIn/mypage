{% extends 'base.html' %}
{% block body %}
    <div class="button-container">
        {% for item in items %}
            <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">
                <button>{{ item.name }}</button>
            </a>
        {% endfor %}
        <button onclick="location.href='/'">홈으로</button>
    </div>
{% endblock body %}
